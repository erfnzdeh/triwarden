name: Triwarden
options:
  bundleIdPrefix: io.github.sinhong2011
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.5.1" # x-release-please-version
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: FX3VR69P5K
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
packages:
  VaultCore:
    path: Packages/VaultCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
targets:
  Triwarden:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources
      - Shared
      - AutoFill/AutoFillView.swift # also rendered by --snapshot
      - path: Design/AppIcon/AppIcon.icon
        buildPhase: resources
      - path: Design/AppIcon/AppIcon.svg
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md # shown in Settings › About › Acknowledgements
        buildPhase: resources
    dependencies:
      - package: VaultCore
        product: TriCrypto
      - package: VaultCore
        product: VaultwardenAPI
      - package: VaultCore
        product: SSHAgent
      - package: Sparkle # signed, verified in-place updates
      - target: TriwardenAutoFill
        embed: true
      - target: TriwardenSafari
        embed: true
      - target: tw
        embed: true
        codeSign: false # keep tw's own signature (and its App Group entitlement)
        copy:
          destination: executables
      - target: TriwardenAutoType
        embed: true
        codeSign: false # keep the helper's own signature (not sandboxed; it alone holds Accessibility)
        copy:
          destination: wrapper
          subpath: Contents/Library/Helpers
    entitlements:
      path: App/Triwarden.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true # attachments: add and Save As
        com.apple.security.application-groups: [FX3VR69P5K.io.github.sinhong2011.triwarden]
        keychain-access-groups: [$(AppIdentifierPrefix)io.github.sinhong2011.triwarden.shared]
        com.apple.developer.authentication-services.autofill-credential-provider: true
        # Sparkle's installer runs as an XPC service outside the sandbox; the app may talk to it.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
        # The palette and the menu bar ask the front browser for its tab's address (only that), to put the
        # site's logins first. Keep in step with ForegroundContext.browsers.
        com.apple.security.automation.apple-events: true
        com.apple.security.temporary-exception.apple-events:
          - com.apple.Safari
          - com.apple.SafariTechnologyPreview
          - com.google.Chrome
          - com.google.Chrome.beta
          - com.google.Chrome.canary
          - com.brave.Browser
          - com.microsoft.edgemac
          - company.thebrowser.Browser
          - company.thebrowser.dia
          - com.vivaldi.Vivaldi
          - org.chromium.Chromium
          - com.operasoftware.Opera
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Triwarden
        # The release sets these (release.sh: MARKETING_VERSION = the tag, CURRENT_PROJECT_VERSION = commit count);
        # Sparkle compares CFBundleVersion, so it must grow with every release.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppleEventsUsageDescription: Triwarden reads the address of your browser's front tab, so the logins for that site come first. It never changes anything in the browser.
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hant, zh-HK, zh-Hans, ja, ko, fr, es, th]
        # Updates (Sparkle): appcast attached to the latest GitHub release; every update must carry an EdDSA
        # signature made with the private key matching SUPublicEDKey (set by `make sparkle-keys`).
        # Fork-style licence (App/Sources/License.swift): Stripe checkout, optional site /pricing/ for Learn More,
        # and the Ed25519 public key used to verify Komori-issued signed keys locally. Without a store link the app
        # never asks.
        TWStoreURL: $(TW_STORE_URL)
        TWPricingURL: $(TW_PRICING_URL)
        TWLicensePublicKey: $(TW_LICENSE_PUBLIC_KEY)
        SUFeedURL: https://github.com/sinhong2011/triwarden/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUEnableInstallerLauncherService: true
        SUEnableAutomaticChecks: false # opt-in: the user turns automatic checks on in Settings
        SUScheduledCheckInterval: 86400
        SUVerifyUpdateBeforeExtraction: true
        # Self-hosted servers on the LAN (IPs, .local) are often plain HTTP or private-CA.
        NSServices:
          - NSMenuItem: {default: "Generate Password with Triwarden"}
            NSMessage: generatePassword
            NSPortName: Triwarden
            NSReturnTypes: [public.utf8-plain-text, NSStringPboardType]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sinhong2011.triwarden
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ControlAccent # neutral graphite for system controls (menus, pickers, switches); Color.brand stays AccentColor
        ENABLE_PREVIEWS: YES # Xcode canvas: see App/Sources/Previews.swift
        # Live Stripe Managed Payments link. Komori fulfills signed keys after verified payment.
        TW_STORE_URL: "https://buy.stripe.com/8x2dRaaSJ1fS4y27r183C00"
        # Official site /pricing/ absolute URL (Learn More). Empty until SITE_URL is verified in production.
        TW_PRICING_URL: ""
        TW_LICENSE_PUBLIC_KEY: "tKfg++yszjBWpgVoyELeDo2CRrKq2RCU+UvNdp5dvIs=" # must match Komori's triwarden-live signing identity
        SPARKLE_PUBLIC_KEY: "7DshdRJXizUaeQeMuAi1w4A8QeYH+2YJxaOdvtxPfTI=" # sparkle-public-key (written by `make sparkle-keys`; the private key never enters the repo)
    scheme:
      testTargets: [TriwardenIconTests, TriwardenUITests]

  TriwardenIconTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AppTests
      - App/Sources/IconStore.swift
    dependencies:
      - package: VaultCore
        product: VaultwardenAPI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sinhong2011.triwarden.icontests
        GENERATE_INFOPLIST_FILE: YES

  TriwardenUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: Triwarden
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sinhong2011.triwarden.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Triwarden

  TriwardenSafari:
    type: app-extension
    platform: macOS
    sources:
      - BrowserExtension/Safari
      - path: BrowserExtension/WebExtension # copied flat: Safari wants manifest.json at Resources/
        buildPhase: resources
    dependencies:
      - package: VaultCore
        product: SSHAgent
    entitlements:
      path: BrowserExtension/Safari/TriwardenSafari.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [FX3VR69P5K.io.github.sinhong2011.triwarden]
    info:
      path: BrowserExtension/Safari/Info.plist
      properties:
        CFBundleDisplayName: Triwarden
        CFBundleShortVersionString: $(MARKETING_VERSION) # extensions carry the app's version
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableDescription: Fill and save logins from your Triwarden vault.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sinhong2011.triwarden.safari
        GENERATE_INFOPLIST_FILE: NO

  # Types logins into other apps for the palette. Not sandboxed, so it can hold Accessibility; the app stays
  # sandboxed and asks it over a socket in the App Group container (Helpers/AutoType/main.swift).
  # Privacy & Security lists this bundle on its own. It needs Triwarden's Icon Composer icon; without one,
  # System Settings shows the generic placeholder.
  TriwardenAutoType:
    type: application
    platform: macOS
    sources:
      - Helpers/AutoType
      - path: Design/AppIcon/AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: VaultCore
        product: SSHAgent
    entitlements:
      path: Helpers/AutoType/AutoType.entitlements
      properties:
        com.apple.security.application-groups: [FX3VR69P5K.io.github.sinhong2011.triwarden] # the socket lives there
    info:
      path: Helpers/AutoType/Info.plist
      properties:
        CFBundleDisplayName: Triwarden Auto-Type
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
    settings:
      base:
        PRODUCT_NAME: Triwarden Auto-Type
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sinhong2011.triwarden.autotype
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  tw:
    type: tool
    platform: macOS
    sources:
      - CLI/main.swift
    dependencies:
      - package: VaultCore
        product: SSHAgent
    entitlements:
      path: CLI/tw.entitlements
      properties:
        com.apple.security.application-groups: [FX3VR69P5K.io.github.sinhong2011.triwarden] # reach the app's socket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sinhong2011.triwarden.tw
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

  TriwardenAutoFill:
    type: app-extension
    platform: macOS
    sources:
      - AutoFill
      - Shared
      - path: App/Resources/Localizable.xcstrings
    dependencies:
      - package: VaultCore
        product: TriCrypto
      - package: VaultCore
        product: VaultwardenAPI
    entitlements:
      path: AutoFill/TriwardenAutoFill.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [FX3VR69P5K.io.github.sinhong2011.triwarden]
        keychain-access-groups: [$(AppIdentifierPrefix)io.github.sinhong2011.triwarden.shared]
        com.apple.developer.authentication-services.autofill-credential-provider: true
        com.apple.security.network.client: true # saving new passkeys to the server
    info:
      path: AutoFill/Info.plist
      properties:
        CFBundleDisplayName: Triwarden
        CFBundleShortVersionString: $(MARKETING_VERSION) # extensions carry the app's version
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hant, zh-HK, zh-Hans, ja, ko, fr, es, th]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              ProvidesOneTimeCodes: true
              ProvidesPasskeys: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sinhong2011.triwarden.autofill
        GENERATE_INFOPLIST_FILE: NO

# Logic tests compile the production cache directly, without launching the app or opening Keychain.
schemes:
  IconStoreTests:
    build:
      targets:
        TriwardenIconTests: [test]
    test:
      targets: [TriwardenIconTests]
