name: Site

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  # Publishing a release does not touch site/**, so the path filters above would skip it.
  # Rebuild so baked version text matches the new release. The client script covers the gap before this finishes.
  release:
    types: [published]

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pull requests, main pushes, and published releases all build. Deploy is the step that is limited.
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      # Same wait as deploy: the release event fires before Triwarden.dmg is uploaded.
      - name: Wait for the release DMG
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for i in $(seq 1 90); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx 'Triwarden.dmg'; then
              echo "Triwarden.dmg is on $TAG"
              exit 0
            fi
            echo "waiting for Triwarden.dmg on $TAG ($i/90)"
            sleep 30
          done
          echo "Triwarden.dmg did not appear on $TAG within 45 minutes"
          exit 1
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASE_PATH: ${{ vars.SITE_BASE_PATH }}
        run: pnpm build

  deploy:
    name: Deploy to Cloudflare Pages
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      # release-please publishes the GitHub release before scripts/release.sh uploads Triwarden.dmg.
      # Building before that asset exists makes latestRelease() return null and drops the version line.
      - name: Wait for the release DMG
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for i in $(seq 1 90); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx 'Triwarden.dmg'; then
              echo "Triwarden.dmg is on $TAG"
              exit 0
            fi
            echo "waiting for Triwarden.dmg on $TAG ($i/90)"
            sleep 30
          done
          echo "Triwarden.dmg did not appear on $TAG within 45 minutes"
          exit 1
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASE_PATH: ${{ vars.SITE_BASE_PATH }}
        run: pnpm build
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./site/dist --project-name ${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch main
