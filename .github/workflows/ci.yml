name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths-ignore:
      - "site/**"
      - ".github/workflows/site.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vaultcore:
    name: VaultCore tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Unit tests
        # Dev-server integration tests skip themselves without TRIWARDEN_DEV_HOST.
        working-directory: Packages/VaultCore
        run: swift test

  app:
    name: Build app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project Triwarden.xcodeproj -scheme Triwarden -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build | tail -20
      - name: Verify local command failure reporting
        run: python3 scripts/test-make-exit-codes.py
      - name: JavaScript syntax
        run: |
          node --check BrowserExtension/WebExtension/content.js
          node --check BrowserExtension/WebExtension/background.js
