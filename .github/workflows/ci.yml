name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit or tag to validate before a manual release
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  vaultcore:
    name: VaultCore tests
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Unit tests
        working-directory: Packages/VaultCore
        run: swift test

  integration:
    name: Vaultwarden ${{ matrix.version }} integration
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native servers avoid unsupported Docker/nested virtualization on macOS runners.
          - version: 1.35.0
            revision: a4907f35390acfd8079ab798a9f6eb785eb17c35
            rust: 1.92.0
            port: 18843
          - version: 1.30.5
            revision: d0c22b9fc90ae52aedbbccdafe9915bd0bdb0d84
            rust: 1.77.2
            port: 18844
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: dani-garcia/vaultwarden
          ref: ${{ matrix.revision }}
          path: .ci-vaultwarden
          persist-credentials: false
      - name: Tools
        run: |
          brew install caddy openssl@3
          rustup toolchain install "$RUST_VERSION" --profile minimal
          python3 -m venv "$RUNNER_TEMP/seed-venv"
          "$RUNNER_TEMP/seed-venv/bin/pip" install requests cryptography argon2-cffi
        env:
          RUST_VERSION: ${{ matrix.rust }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .ci-vaultwarden/target
          key: vaultwarden-${{ runner.os }}-${{ runner.arch }}-${{ matrix.revision }}-${{ matrix.rust }}
      - name: Build native disposable server
        working-directory: .ci-vaultwarden
        env:
          RUST_VERSION: ${{ matrix.rust }}
        run: |
          OPENSSL_DIR=$(brew --prefix openssl@3)
          export OPENSSL_DIR
          cargo +"$RUST_VERSION" build --locked --features sqlite
      - name: Seed and test over HTTPS
        env:
          CI_SERVER_PORT: ${{ matrix.port }}
          CI_SEED_PYTHON: ${{ runner.temp }}/seed-venv/bin/python
        run: scripts/ci/integration.sh "$GITHUB_WORKSPACE/.ci-vaultwarden/target/debug/vaultwarden"
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ matrix.version }}-logs
          path: build/ci-integration/*.log

  app:
    name: Build app
    # This existing required check is the final gate, including server tests.
    needs: [vaultcore, integration]
    if: always()
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Require successful tests
        env:
          CORE_RESULT: ${{ needs.vaultcore.result }}
          SERVER_RESULT: ${{ needs.integration.result }}
        run: test "$CORE_RESULT" = success && test "$SERVER_RESULT" = success
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          mkdir -p build/ci
          xcodebuild -project Triwarden.xcodeproj -scheme Triwarden -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build/ci/build.log | tail -20
      - name: Offline compatibility self-test
        run: |
          # Older release tags predate this entry point; current PRs must run it.
          if [[ -f App/Sources/CompatibilitySelfTest.swift ]]; then
            build/Build/Products/Debug/Triwarden.app/Contents/MacOS/Triwarden --selftest-compatibility | tee build/ci/compatibility.log
          elif [[ '${{ github.event_name }}' != workflow_dispatch ]]; then
            echo 'Compatibility self-test is missing' >&2
            exit 1
          fi
      - name: UI smoke tests (ad-hoc signing, no release credentials)
        run: |
          test -f UITests/CISmokeTests.swift
          xcodebuild -project Triwarden.xcodeproj -scheme Triwarden -configuration Debug \
            -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" DEVELOPMENT_TEAM="" \
            -resultBundlePath build/ci/ui-smoke.xcresult \
            -only-testing:TriwardenUITests/CISmokeTests test 2>&1 | tee build/ci/ui-smoke.log | tail -30
      - name: Verify local command failure reporting
        run: python3 scripts/test-make-exit-codes.py
      - name: JavaScript syntax
        run: |
          node --check BrowserExtension/WebExtension/content.js
          node --check BrowserExtension/WebExtension/background.js
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-ci-evidence
          path: build/ci/
