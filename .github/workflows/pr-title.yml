# Require Conventional Commits on PR titles so squash merges feed release-please.
# Types match release-please-config.json changelog-sections (plus common non-release types).
name: PR title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  lint:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            security
            ui
            docs
            chore
            test
            ci
            refactor
            build
            revert
          # Single-scope optional; subject required after the type.
          requireScope: false
          # release-please opens "chore: release X.Y.Z" — already allowed via chore.
